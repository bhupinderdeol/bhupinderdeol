let ac,lastSnd=0,muted=0;
function snd(f,d,v,type='triangle'){
  if(muted)return;
  const n=performance.now();if(n-lastSnd<38)return;lastSnd=n;
  try{
    ac=ac||new(window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;
    o.type=type;o.frequency.value=f;
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);
    o.connect(g);g.connect(ac.destination);o.start();o.stop(t+d);
  }catch(e){}
}

/* ---------- Terrain ---------- */
function gh(x,z){
  let h=.055*Math.sin(x*.62+1.3)+.045*Math.cos(z*.71-.6)+.035*Math.sin((x+z)*.44+2.1);
  const d=Math.hypot(x,z);
  if(d<HR)h-=HD*(1-Math.pow(d/HR,1.8));
  else if(d<HR*2.6)h+=.05*Math.sin(Math.PI*Math.min(1,(d-HR)/(HR*1.6)));
  return h;
}

function stepMarble(m,dt){
  if(m.frozen){
    m.sh.position.set(m.pos.x,gh(m.pos.x,m.pos.z)+.008,m.pos.z);
    return;
  }
  const gy=gh(m.pos.x,m.pos.z)+R,dh=Math.hypot(m.pos.x,m.pos.z),hs=Math.hypot(m.vel.x,m.vel.z);
  if(!m.inHole&&(m.pos.y<-.15||(dh<HR*.52&&hs<4.2)))m.inHole=true;
  if(m.inHole)m.vel.multiplyScalar(Math.max(0,1-7*dt));
  if(m.pos.y>gy+.004){
    m.vel.y-=G*dt;m.pos.addScaledVector(m.vel,dt);
    const g2=gh(m.pos.x,m.pos.z)+R;
    if(m.pos.y<=g2){m.pos.y=g2;if(m.vel.y<0){m.vel.y=-m.vel.y*.34;if(m.vel.y<.55)m.vel.y=0}m.vel.x*=.87;m.vel.z*=.87}
  }else{
    m.pos.y=gy;if(m.vel.y<0)m.vel.y=0;
    const e=.06,hx=(gh(m.pos.x+e,m.pos.z)-gh(m.pos.x-e,m.pos.z))/(2*e),hz=(gh(m.pos.x,m.pos.z+e)-gh(m.pos.x,m.pos.z-e))/(2*e);
    m.vel.x-=G*hx*dt*SK;m.vel.z-=G*hz*dt*SK;
    const sp=Math.hypot(m.vel.x,m.vel.z);
    if(sp>1e-5){const k=Math.max(0,sp-FR*dt)/sp;m.vel.x*=k;m.vel.z*=k}
    m.pos.x+=m.vel.x*dt;m.pos.z+=m.vel.z*dt;
    const g3=gh(m.pos.x,m.pos.z)+R;if(m.pos.y<g3)m.pos.y=g3;
  }
  const s2=Math.hypot(m.vel.x,m.vel.z);
  if(s2>.02){const ax=new V(m.vel.z,0,-m.vel.x).normalize();m.mesh.rotateOnWorldAxis(ax,s2*dt/R)}
  m.mesh.position.copy(m.pos);
  m.sh.position.set(m.pos.x,gh(m.pos.x,m.pos.z)+.008,m.pos.z);
}
function collide(a,b){
  const dx=b.pos.x-a.pos.x,dz=b.pos.z-a.pos.z,md=2*R,d2=dx*dx+dz*dz;
  if(d2>md*md||Math.abs(b.pos.y-a.pos.y)>md)return;
  const d=Math.sqrt(d2)||1e-5,nx=dx/d,nz=dz/d,o=(md-d)/2;
  a.pos.x-=nx*o;a.pos.z-=nz*o;b.pos.x+=nx*o;b.pos.z+=nz*o;
  const df=(b.vel.x*nx+b.vel.z*nz)-(a.vel.x*nx+a.vel.z*nz);
  if(Math.abs(df)>.5)snd(1300+rnd(0,600),.07,Math.min(.14,Math.abs(df)*.02));
  a.vel.x+=df*nx;a.vel.z+=df*nz;b.vel.x-=df*nx;b.vel.z-=df*nz;
}

function physics(dt){
  acc+=dt;let n=0;
  while(acc>=FDT&&n<8){

    for(const m of L)stepMarble(m,FDT);
    for(let i=0;i<L.length;i++)for(let j=i+1;j<L.length;j++)collide(L[i],L[j]);
    if(S.phase==='shooting'&&S.target&&S.shot&&!S.hit&&Math.hypot(S.shot.pos.x-S.target.pos.x,S.shot.pos.z-S.target.pos.z)<HIT){

}

  return new Promise(res=>{const t0=performance.now();
    const f=()=>{if(S.phase!=='aim'||performance.now()-t0>45000){
        if(S.phase==='aim'){const t=S.target,s=S.shot,l=Math.hypot(t.pos.x-s.pos.x,t.pos.z-s.pos.z)||1;jv.x=(t.pos.x-s.pos.x)/l*.7;jv.y=(t.pos.z-s.pos.z)/l*.7;fire()}

    requestAnimationFrame(f)});

async function resolveRound(){
  S.phase='resolve';

  const inH=S.marbles.filter(m=>m.inHole),th=S.players[S.thrower];
  if(S.hit){
    big('POT WON');flash();const n=S.marbles.length;th.marbles+=n;
    say(`${th.name} hit the target and scoops the whole pot — ${n} marbles!`);
    S.marbles.forEach(m=>m.frozen=true);await wait(700);S.marbles.forEach(kill);S.marbles=[];
  }else{
    big('MISS');
    say(inH.length?`${th.name} missed — but keeps the ${inH.length} marble${inH.length>1?'s':''} that dropped in the pit.`:`${th.name} missed — and nothing fell in the pit.`);
    th.marbles+=inH.length;inH.forEach(kill);S.marbles=S.marbles.filter(m=>!m.inHole);
    S.marbles.forEach(m=>m.frozen=true);await wait(750);

let running=false;
async function play(){
  if(running)return;running=true;
  while(S.round<S.max&&S.players.filter(p=>p.marbles>0).length>1){
    S.round++;hud();big('ROUND '+S.round);
    for(const p of S.players){const n=Math.min(S.c,p.marbles);p.marbles-=n;for(let i=0;i<n;i++)S.marbles.push(mk(PAL[Math.random()*PAL.length|0]))}
    hud();if(!S.marbles.length)break;
    await doThrow();
    const th=S.players[S.thrower];let target=null;
    if(loose().length){
      S.phase='target';const ds=S.players[(S.thrower+1)%S.players.length];
      if(ds.isHuman)target=await humanPick();else{say(`${ds.name} is sizing up the hardest marble…`);await wait(900);target=hardest()}
    }
    if(!target){
      const inH=S.marbles.filter(m=>m.inHole);th.marbles+=inH.length;S.marbles.forEach(kill);S.marbles=[];
      say(`Everything dropped in the pit — ${th.name} keeps ${inH.length}.`);hud();await wait(1400);
    }else{
      S.target=target;selRing.visible=false;beginAim();
      if(th.isHuman){elJw.classList.add('on');say('Your flick — drag the circle toward the target, release to shoot');await humanShot()}
      else{say(`${th.name} is lining up the shot…`);await wait(950);aiShot()}
      await settle(6000);await resolveRound();S.target=null;
    }
    let g=0;do{S.thrower=(S.thrower+1)%S.players.length}while(S.players[S.thrower].marbles<=0&&++g<8);
    hud();await wait(280);
  }
  running=false;endGame();
}

function sim(f,ko){

function stand(g){

  T.fx.filter(f=>f.g===g&&f.done).forEach(f=>{const a=r[f.a],b=r[f.b];a.p++;b.p++;a.f+=f.ga;b.f+=f.gb;a.d+=f.ga-f.gb;b.d+=f.gb-f.ga;

/* Initialize FIFA 32-Nation World Cup OR 195-Nation Global Gauntlet */
function newWorldCup(countryIdx){
  const me=COUNTRIES[countryIdx].name;
  const str={};
  COUNTRIES.forEach(c=>str[c.name]=c.ovr + Math.round(rnd(-2,3)));
  str[me]=Math.max(str[me],88);

  if(wFormat==='gauntlet'){
    const pool=COUNTRIES.map(c=>c.name).sort(()=>Math.random()-.5);
    W={format:'gauntlet',me,pool,history:[],str,live:0,champ:null,exitStage:null,nextOpp:null};
    drawNextGauntletRival();
    saveWorld();
    worldHub();
    return;
  }

  // FIFA 32-Nation World Cup Finals Draw (User's country + top 31 seeded/qualified nations across all confederations)
  const others=COUNTRIES.filter(c=>c.name!==me)
    .sort((a,b)=>(b.ovr+rnd(-8,8))-(a.ovr+rnd(-8,8)))
    .slice(0,31)
    .map(c=>c.name);
  const qualified=[me,...others].sort((a,b)=>str[b]-str[a]);

  // Seed into 4 Pots of 8 teams (just like FIFA World Cup Draw!)
  const pots=[qualified.slice(0,8),qualified.slice(8,16),qualified.slice(16,24),qualified.slice(24,32)];
  const groups=[[],[],[],[],[],[],[],[]];
  pots.forEach(pot=>{
    const shuffled=[...pot].sort(()=>Math.random()-.5);
    shuffled.forEach((team,gi)=>groups[gi].push(team));
  });

  // Generate 6 Round-Robin Group Fixtures per Group (48 total group matches)
  const fx=[];
  groups.forEach((g,gi)=>{
    for(let a=0;a<4;a++)for(let b=a+1;b<4;b++)fx.push({g:gi,a:g[a],b:g[b],done:0});
  });

  W={
    format:'fifa',
    me,
    groups,
    str,
    fx,
    stage:'G',
    ko:[],
    live:0,
    champ:null,
    exitStage:null,
    gi:groups.findIndex(g=>g.includes(me))
  };
  saveWorld();
  worldHub();
}

/* FIFA World Cup Helpers */
const wMine=f=>f.a===W.me||f.b===W.me;
const wFin=(f,ga,gb,pen)=>Object.assign(f,{ga,gb,pen,done:1});
function wSim(f,ko){
  const g=t=>Math.max(0,Math.round(3+(W.str[t]-65)/9+rnd(0,5)));
  let ga=g(f.a),gb=g(f.b),pen=0;
  if(ko&&ga===gb){pen=1;Math.random()<W.str[f.a]/(W.str[f.a]+W.str[f.b])?ga++:gb++}
  wFin(f,ga,gb,pen);
}
function wStand(gi){
  const r={};
  W.groups[gi].forEach(t=>r[t]={t,p:0,w:0,d:0,l:0,f:0,a:0,gd:0,pt:0});
  W.fx.filter(f=>f.g===gi&&f.done).forEach(f=>{
    const A=r[f.a],B=r[f.b];
    A.p++;B.p++;A.f+=f.ga;A.a+=f.gb;B.f+=f.gb;B.a+=f.ga;
    A.gd=A.f-A.a;B.gd=B.f-B.a;
    if(f.ga>f.gb){A.w++;B.l++;A.pt+=3}
    else if(f.ga<f.gb){B.w++;A.l++;B.pt+=3}
    else{A.d++;B.d++;A.pt++;B.pt++}
  });
  return Object.values(r).sort((x,y)=>y.pt-x.pt||y.gd-x.gd||y.f-x.f||W.str[y.t]-W.str[x.t]);
}
function wBatch(){
  const L=W.fx.filter(f=>!f.done&&!wMine(f)).sort(()=>Math.random()-.5);
  const remMine=W.fx.filter(f=>!f.done&&wMine(f)).length;
  const n=remMine?Math.ceil(L.length/(remMine+1)):L.length;
  L.slice(0,n).forEach(f=>wSim(f,0));
  if(W.fx.every(f=>f.done))wToKO();
}
function wToKO(){
  const q=W.groups.map((_,gi)=>wStand(gi).slice(0,2).map(r=>r.t));
  if(!q.flat().includes(W.me))W.exitStage='G';
  W.stage='R16';
  // Authentic FIFA World Cup Bracket Pairing: A1vB2, C1vD2, E1vF2, G1vH2, B1vA2, D1vC2, F1vE2, H1vG2
  W.ko=[
    [q[0][0],q[1][1]],[q[2][0],q[3][1]],[q[4][0],q[5][1]],[q[6][0],q[7][1]],
    [q[1][0],q[0][1]],[q[3][0],q[2][1]],[q[5][0],q[4][1]],[q[7][0],q[6][1]]
  ].map(([a,b])=>({a,b,done:0}));
  wPlayOut();
}
function wPlayOut(){
  for(;;){
    W.ko.forEach(f=>{if(!f.done&&!wMine(f))wSim(f,1)});
    if(W.ko.some(f=>!f.done))return;
    const winners=W.ko.map(f=>f.ga>f.gb?f.a:f.b);
    if(W.stage==='F'){W.champ=winners[0];return}
    W.stage=W.stage==='R16'?'QF':W.stage==='QF'?'SF':'F';
    W.ko=[];
    for(let i=0;i<winners.length;i+=2)W.ko.push({a:winners[i],b:winners[i+1],done:0});
  }
}

/* Global 195-Nation Gauntlet Helpers */
function drawNextGauntletRival(){
  if(!W || W.champ)return;
  const rivals=W.pool.filter(c=>c!==W.me);
  if(!rivals.length){W.champ=W.me;return}
  W.nextOpp=rivals[Math.floor(Math.random()*rivals.length)];
}
function simOtherGauntletClashes(){
  const others=W.pool.filter(c=>c!==W.me && c!==W.nextOpp).sort(()=>Math.random()-.5);
  if(others.length<2)return;
  const pairs=Math.max(1,Math.floor(others.length/2));
  for(let i=0;i+1<pairs*2;i+=2){
    const a=others[i],b=others[i+1];
    let ga=Math.round(4+(W.str[a]-68)/9+rnd(0,5)),gb=Math.round(4+(W.str[b]-68)/9+rnd(0,5));
    if(ga===gb)Math.random()<W.str[a]/(W.str[a]+W.str[b])?ga++:gb++;
    const loser=ga>gb?b:a;
    W.pool=W.pool.filter(c=>c!==loser);
    W.history.unshift({a,b,ga,gb,user:false});
  }
}

function worldResult(){
  W.live=0;
  if(W.format==='gauntlet'){
    const opp=W.nextOpp;
    let hh=S.players[0].marbles,oo=S.players[1].marbles,pen=0;
    if(hh===oo){pen=1;Math.random()<.52?hh++:oo++}
    W.history.unshift({a:W.me,b:opp,ga:hh,gb:oo,user:true});
    if(hh>oo){
      W.pool=W.pool.filter(c=>c!==opp);
      W.str[W.me]=Math.min(99,W.str[W.me]+1);
      simOtherGauntletClashes();
      W.nextOpp=null;drawNextGauntletRival();saveWorld();
      const isChamp=W.champ===W.me;
      open(`<h1 class="${H1}">${isChamp?'🏆 WORLD CHAMPIONS!':'World Victory! 🌍'}</h1>`+
      para(`<b>${W.me} ${hh} – ${oo} ${opp}</b>${pen?' (Golden Toss)':''}<br>${isChamp?`<b>${W.me}</b> conquered all 195 nations!`:`Next random challenger: <b>${W.nextOpp}</b> (${W.pool.length} nations left).`}`)+
      `<button class="${BTN_WLD}" data-act="worldHub">${isChamp?'CLAIM WORLD TROPHY':'NEXT RANDOM NATION'}</button>`);
    }else{
      W.exitStage='Global Gauntlet';
      while(W.pool.length>1){
        W.pool.sort(()=>Math.random()-.5);
        const a=W.pool[0],b=W.pool[1];
        W.pool=W.pool.filter(c=>c!==(W.str[a]+rnd(0,12)>W.str[b]+rnd(0,12)?b:a));

      W.champ=W.pool[0];saveWorld();
      open(`<h1 class="${H1}">Eliminated</h1>`+para(`<b>${W.me} ${hh} – ${oo} ${opp}</b><br><b>${W.champ}</b> won the World Marbles Championship.`)+`<button class="${BTN}" data-act="worldHub">VIEW SUMMARY</button>`);

  // FIFA 32-Nation World Cup Match Resolution
  const f=W.cur,h=S.players[0].marbles,o=S.players[1].marbles,ko=W.stage!=='G',isA=f.a===W.me;
  let hh=h,oo=o,pen=0;
  if(ko&&h===o){pen=1;Math.random()<.52?hh++:oo++}
  wFin(f,isA?hh:oo,isA?oo:hh,pen);
  if(!ko)wBatch();
  else{
    if(hh<oo)W.exitStage=W.stage;
    wPlayOut();
  }
  saveWorld();
  const oppName=isA?f.b:f.a;
  open(`<h1 class="${H1}">${hh>oo?'World Cup Win! 🌍':hh<oo?'Defeat':'Draw'}</h1>`+
  para(`${W.me} <b>${hh}</b> – <b>${oo}</b> ${oppName}${pen?'<br>Level after four rounds — decided by golden toss.':''}`)+
  `<button class="${BTN_WLD}" data-act="worldHub">CONTINUE WORLD CUP</button>`);

function newCosmicCup(bodyIdx){
  const chosen=COSMIC_BODIES[bodyIdx];
  const me=chosen.name;
  const homePlanet=chosen.planet;
  const str={};
  COSMIC_BODIES.forEach(b=>str[b.name]=b.ovr + Math.round(rnd(-2,2)));
  str[me]=Math.max(str[me],90);

  if(cFormat==='gauntlet'){
    const pool=COSMIC_BODIES.map(b=>b.name).sort(()=>Math.random()-.5);
    C_CUP={format:'gauntlet',me,homePlanet,pool,history:[],str,live:0,champ:null,exitStage:null,nextOpp:null};
    drawCosmicGauntletRival();
    saveCosmic();
    cosmicHub();
    return;
  }

  // Stage 1: Planetary System Moon Qualifiers (if homePlanet has moons!)
  const sysMoons=SOLAR_SYSTEM_DATA[homePlanet]||[];
  const sysContenders=[homePlanet,...sysMoons];
  const moonRivals=sysContenders.filter(x=>x!==me).sort(()=>Math.random()-.5);

  C_CUP={
    format:'system',
    me,
    homePlanet,
    sysContenders,
    moonRivals,
    moonHistory:[],
    str,
    stage:moonRivals.length?'M':'G',
    groups:[[],[]],
    fx:[],
    ko:[],
    gi:0,
    live:0,
    champ:null,
    exitStage:null
  };

  if(!moonRivals.length){
    initInterplanetaryStage();
  }
  saveCosmic();
  cosmicHub();
}

function initInterplanetaryStage(){
  // Simulate other planetary systems to crown the 8 Planetary Representatives
  const reps=PLANET_NAMES.map(pl=>{
    if(pl===C_CUP.homePlanet)return C_CUP.me;
    const moons=SOLAR_SYSTEM_DATA[pl]||[];
    if(!moons.length)return pl;
    // Slight edge to the host planet, though top moons like Titan/Ganymede/Triton can upset!
    const candidates=[pl,...moons];
    return candidates.sort((a,b)=>(C_CUP.str[b]+rnd(0,10))-(C_CUP.str[a]+rnd(0,10)))[0];
  });

  // Group A: Inner Solar System (Mercury, Venus, Earth, Mars systems), Group B: Outer Gas & Ice Giants (Jupiter, Saturn, Uranus, Neptune systems)
  const gA=reps.slice(0,4);
  const gB=reps.slice(4,8);
  C_CUP.groups=[gA,gB];
  C_CUP.gi=gA.includes(C_CUP.me)?0:1;
  C_CUP.stage='G';
  C_CUP.fx=[];
  C_CUP.groups.forEach((g,gi)=>{
    for(let a=0;a<4;a++)for(let b=a+1;b<4;b++)C_CUP.fx.push({g:gi,a:g[a],b:g[b],done:0});
  });
}

const cMine=f=>f.a===C_CUP.me||f.b===C_CUP.me;
const cFin=(f,ga,gb,pen)=>Object.assign(f,{ga,gb,pen,done:1});
function cSim(f,ko){
  const g=t=>Math.max(0,Math.round(3+(C_CUP.str[t]-72)/8+rnd(0,5)));
  let ga=g(f.a),gb=g(f.b),pen=0;
  if(ko&&ga===gb){pen=1;Math.random()<C_CUP.str[f.a]/(C_CUP.str[f.a]+C_CUP.str[f.b])?ga++:gb++}
  cFin(f,ga,gb,pen);
}
function cStand(gi){
  const r={};
  C_CUP.groups[gi].forEach(t=>r[t]={t,p:0,w:0,d:0,l:0,f:0,a:0,gd:0,pt:0});
  C_CUP.fx.filter(f=>f.g===gi&&f.done).forEach(f=>{
    const A=r[f.a],B=r[f.b];
    A.p++;B.p++;A.f+=f.ga;A.a+=f.gb;B.f+=f.gb;B.a+=f.ga;
    A.gd=A.f-A.a;B.gd=B.f-B.a;
    if(f.ga>f.gb){A.w++;B.l++;A.pt+=3}
    else if(f.ga<f.gb){B.w++;A.l++;B.pt+=3}
    else{A.d++;B.d++;A.pt++;B.pt++}
  });
  return Object.values(r).sort((x,y)=>y.pt-x.pt||y.gd-y.gd||y.f-y.f||C_CUP.str[y.t]-C_CUP.str[x.t]);
}
function cBatch(){
  const L=C_CUP.fx.filter(f=>!f.done&&!cMine(f)).sort(()=>Math.random()-.5);
  const rem=C_CUP.fx.filter(f=>!f.done&&cMine(f)).length;
  const n=rem?Math.ceil(L.length/(rem+1)):L.length;
  L.slice(0,n).forEach(f=>cSim(f,0));
  if(C_CUP.fx.every(f=>f.done))cToKO();
}
function cToKO(){
  const q=C_CUP.groups.map((_,gi)=>cStand(gi).slice(0,2).map(r=>r.t));
  if(!q.flat().includes(C_CUP.me))C_CUP.exitStage='G';
  C_CUP.stage='SF';
  C_CUP.ko=[[q[0][0],q[1][1]],[q[1][0],q[0][1]]].map(([a,b])=>({a,b,done:0}));
  cPlayOut();
}
function cPlayOut(){
  for(;;){
    C_CUP.ko.forEach(f=>{if(!f.done&&!cMine(f))cSim(f,1)});
    if(C_CUP.ko.some(f=>!f.done))return;
    const w=C_CUP.ko.map(f=>f.ga>f.gb?f.a:f.b);
    if(C_CUP.stage==='F'){C_CUP.champ=w[0];return}
    C_CUP.stage='F';
    C_CUP.ko=[{a:w[0],b:w[1],done:0}];
  }
}

function drawCosmicGauntletRival(){
  if(!C_CUP||C_CUP.champ)return;
  const rivals=C_CUP.pool.filter(b=>b!==C_CUP.me);
  if(!rivals.length){C_CUP.champ=C_CUP.me;return}
  C_CUP.nextOpp=rivals[Math.floor(Math.random()*rivals.length)];
}
function simCosmicGauntletOthers(){
  const others=C_CUP.pool.filter(b=>b!==C_CUP.me&&b!==C_CUP.nextOpp).sort(()=>Math.random()-.5);
  if(others.length<2)return;
  const pairs=Math.max(1,Math.floor(others.length/2));
  for(let i=0;i+1<pairs*2;i+=2){
    const a=others[i],b=others[i+1];
    let ga=Math.round(4+(C_CUP.str[a]-72)/8+rnd(0,5)),gb=Math.round(4+(C_CUP.str[b]-72)/8+rnd(0,5));
    if(ga===gb)Math.random()<C_CUP.str[a]/(C_CUP.str[a]+C_CUP.str[b])?ga++:gb++;
    const loser=ga>gb?b:a;
    C_CUP.pool=C_CUP.pool.filter(x=>x!==loser);
    C_CUP.history.unshift({a,b,ga,gb,user:false});
  }
}

    start([C_CUP.me,opp],'cosmic');
    return;
  }
  if(C_CUP.stage==='M'){
    const opp=C_CUP.moonRivals[0];
    C_CUP.live=1;
    AIQ=cl((106-C_CUP.str[opp])/34,.42,1.55);
    start([C_CUP.me,opp],'cosmic');
    return;
  }
  const f=(C_CUP.stage==='G'?C_CUP.fx:C_CUP.ko).find(f=>!f.done&&cMine(f));
  const opp=f.a===C_CUP.me?f.b:f.a;
  C_CUP.cur=f;C_CUP.live=1;
  AIQ=cl((106-C_CUP.str[opp])/34,.38,1.5);
  start([C_CUP.me,opp],'cosmic');
}

function cosmicResult(){
  C_CUP.live=0;
  let hh=S.players[0].marbles,oo=S.players[1].marbles,pen=0;

  if(C_CUP.format==='gauntlet'){
    const opp=C_CUP.nextOpp;
    if(hh===oo){pen=1;Math.random()<.52?hh++:oo++}
    C_CUP.history.unshift({a:C_CUP.me,b:opp,ga:hh,gb:oo,user:true});
    if(hh>oo){
      C_CUP.pool=C_CUP.pool.filter(x=>x!==opp);
      C_CUP.str[C_CUP.me]=Math.min(99,C_CUP.str[C_CUP.me]+1);
      simCosmicGauntletOthers();
      C_CUP.nextOpp=null;drawCosmicGauntletRival();saveCosmic();
      const isChamp=C_CUP.champ===C_CUP.me;
      open(`<h1 class="${H1}">${isChamp?'🏆 SOLAR SYSTEM RULER!':'Cosmic Victory! 🪐'}</h1>`+
      para(`<b>${C_CUP.me} ${hh} – ${oo} ${opp}</b>${pen?' (Golden Toss)':''}<br>${isChamp?`<b>${C_CUP.me}</b> conquered all 33 celestial bodies!`:`Next random celestial opponent: <b>${C_CUP.nextOpp}</b> (${C_CUP.pool.length} left).`}`)+
      `<button class="${BTN_COS}" data-act="cosmicHub">${isChamp?'CLAIM COSMIC TROPHY':'NEXT CELESTIAL BODY'}</button>`);
    }else{
      C_CUP.exitStage='33-Body Gauntlet';
      while(C_CUP.pool.length>1){
        C_CUP.pool.sort(()=>Math.random()-.5);
        const a=C_CUP.pool[0],b=C_CUP.pool[1];
        C_CUP.pool=C_CUP.pool.filter(x=>x!==(C_CUP.str[a]+rnd(0,10)>C_CUP.str[b]+rnd(0,10)?b:a));
      }
      C_CUP.champ=C_CUP.pool[0];saveCosmic();
      open(`<h1 class="${H1}">Cosmic Elimination</h1>`+para(`<b>${C_CUP.me} ${hh} – ${oo} ${opp}</b><br><b>${C_CUP.champ}</b> won the Solar System Cup.`)+`<button class="${BTN}" data-act="cosmicHub">VIEW SUMMARY</button>`);
    }
    return;
  }

  // Stage 1: Moon System Qualifier Result
  if(C_CUP.stage==='M'){
    const opp=C_CUP.moonRivals[0];
    if(hh===oo){pen=1;Math.random()<.52?hh++:oo++}
    if(hh>oo){
      C_CUP.moonHistory.push({a:C_CUP.me,b:opp,ga:hh,gb:oo});
      C_CUP.moonRivals.shift();
      const clearedAllMoons=C_CUP.moonRivals.length===0;
      if(clearedAllMoons)initInterplanetaryStage();
      saveCosmic();
      open(`<h1 class="${H1}">${clearedAllMoons?'👑 '+C_CUP.homePlanet+' System Champion!':'Orbital Victory! 🌙'}</h1>`+
      para(`<b>${C_CUP.me} ${hh} – ${oo} ${opp}</b>${pen?' (Golden Toss)':''}<br>${clearedAllMoons
        ?`All moons in the <b>${C_CUP.homePlanet}</b> system defeated! You now advance to the <b>8-Planet Interplanetary Finals</b>!`
        :`Next moon challenger in ${C_CUP.homePlanet} orbit: <b>${C_CUP.moonRivals[0]}</b>.`}`)+
      `<button class="${BTN_COS}" data-act="cosmicHub">${clearedAllMoons?'ENTER 8-PLANET FINALS':'NEXT MOON CHALLENGER'}</button>`);
    }else{
      C_CUP.exitStage='M';
      C_CUP.champ=opp;
      saveCosmic();
      open(`<h1 class="${H1}">Upset in ${C_CUP.homePlanet} Orbit!</h1>`+para(`<b>${C_CUP.me} ${hh} – ${oo} ${opp}</b><br><b>${opp}</b> claimed the ${C_CUP.homePlanet} system crown.`)+`<button class="${BTN}" data-act="cosmicHub">VIEW SUMMARY</button>`);
    }
    return;
  }

  // Stage 2: 8-Planet Interplanetary Group / Knockout Result
  const f=C_CUP.cur,ko=C_CUP.stage!=='G',isA=f.a===C_CUP.me;
  if(ko&&hh===oo){pen=1;Math.random()<.52?hh++:oo++}
  cFin(f,isA?hh:oo,isA?oo:hh,pen);
  if(!ko)cBatch();
  else{
    if(hh<oo)C_CUP.exitStage=C_CUP.stage;
    cPlayOut();
  }
  saveCosmic();
  const oppName=isA?f.b:f.a;
  open(`<h1 class="${H1}">${hh>oo?'Interplanetary Win! 🪐':hh<oo?'Defeat':'Draw'}</h1>`+
  para(`${C_CUP.me} <b>${hh}</b> – <b>${oo}</b> ${oppName}${pen?'<br>Level after four rounds — decided by golden toss.':''}`)+
  `<button class="${BTN_COS}" data-act="cosmicHub">CONTINUE COSMIC CUP</button>`);
}

    $(this).removeClass('border-white/10 bg-white/5 text-amber-100/70').addClass('border-[#ffd479] bg-amber-400/20 text-[#ffd479]');
    renderWorldCountryGrid();
  })
  .on('click','.wfmt',function(){
    wFormat=$(this).data('fmt');
    $('.wfmt').removeClass('border-[#ffd479] bg-amber-400/20 border-sky-300 bg-sky-400/20 text-white').addClass('border-white/10 bg-white/5 text-amber-100/75');
    $(this).removeClass('border-white/10 bg-white/5 text-amber-100/75').addClass(wFormat==='fifa'?'border-[#ffd479] bg-amber-400/20 text-white':'border-sky-300 bg-sky-400/20 text-white');
  })
  .on('click','[data-ci]',function(){newWorldCup(+$(this).data('ci'))});

/* ---------- Global Event Wiring ---------- */
$('#panel').on('input','#nm',function(){cfg.name=this.value.replace(/[<>&"']/g,'')});
$('#panel').on('click','.opt',function(){const r=$(this).parent();cfg[r.data('k')]=+$(this).data('v');r.children().removeClass('sel');$(this).addClass('sel');potTxt()})
 .on('click','[data-act]',function(){
   const act=$(this).data('act');
   const map={
     setup,rules,start:()=>start(),
     cup,cupPlay,cupReset,cupHub,promotePunjab,
     natCup,natPlay,natReset,natHub,promoteIndia,
     worldCup,worldPlay,worldReset,worldHub,promoteEarth,
     cosmicCup,cosmicPlay,cosmicReset,cosmicHub,
     back:()=>backFn?backFn():close()
   };
   if(map[act])map[act]();
 });
$('#help').on('click',()=>{if(S.phase==='setup'||S.phase==='over')return;backFn=close;rules()});

/* ---------- Main Animation Loop ---------- */
let last=performance.now();
function frame(now){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(now-last)/1000);
  physics(dt);last=now;
  animKids(now/1000,dt);
  radar();

  const t=now*.001;
  for(let i=0;i<canopies.length;i++){
    const c=canopies[i];
    c.crown.rotation.z=Math.sin(t*1.1+c.ph)*.025;
    c.crown.rotation.x=Math.cos(t*.9+c.ph)*.02;
  }
  const dp=dustGeo.attributes.position.array;
  for(let i=0;i<dustCount;i++){
    dp[i*3+1]+=Math.sin(t+i)*.0015;
    dp[i*3]+=Math.cos(t*.7+i)*.0015;
  }
  dustGeo.attributes.position.needsUpdate=true;

  const sh=S.phase==='shooting'&&S.shot;
  look.lerp(sh?S.shot.pos:lookBase,sh?.07:.04);
  cam.position.set(camBase.x+Math.sin(now*3e-4)*.18,camBase.y+Math.sin(now*4e-4)*.06,camBase.z);
  cam.lookAt(look);
  if(fovK>.01){fovK*=.94;cam.fov=42-6*fovK;cam.updateProjectionMatrix()}
  if(S.phase==='aim')guide();
  if(selRing.visible){selRing.material.opacity=.55+Math.sin(now*.006)*.35;selRing.scale.setScalar(1+Math.sin(now*.006)*.08)}
  ren.render(scene,cam);
}
addEventListener('resize',()=>{ren.setSize(innerWidth,innerHeight,false);cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();fitCamera()});
addEventListener('orientationchange',()=>setTimeout(()=>dispatchEvent(new Event('resize')),120));
document.addEventListener('gesturestart',e=>e.preventDefault());

buildGround();buildVillage(6);fitCamera();hud();story();requestAnimationFrame(frame);
</script>
</body>
</html>
